<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>King Agents</title>
  <meta name="description" content="King Agents — multi-agent AI workspace" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brandRow">
        <div class="brand"><div class="crown">♛</div><strong>King Agents</strong></div>
        <button class="tinyBtn" aria-label="طي القائمة">◧</button>
      </div>
      <button id="newChat" class="newChat" type="button"><span>＋</span><b>محادثة جديدة</b></button>
      <div class="quickNav"><button type="button">▣ <span>المحادثات</span></button><button type="button">◉ <span>المستكشف</span></button></div>
      <div class="sectionLabel">الوكلاء</div>
      <nav id="agents" class="agents" aria-label="اختيار الوكيل"></nav>
      <div class="profileBar"><div class="profileIcon">♛</div><div><strong>King Agents</strong><span>ذكاء اصطناعي بلا حدود</span></div><span class="dots">⋮</span></div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <button id="menuToggle" class="iconButton" type="button" aria-label="فتح القائمة">☰</button>
        <button id="agentSwitcher" class="modelPicker" type="button">
          <div class="modelIcon">✦</div>
          <div><strong id="agentTitle">الوكيل العام</strong><span id="agentDesc">OpenRouter</span></div>
          <span>⌄</span>
        </button>
        <div class="topActions"><button>⌕</button><button>◔</button><div class="avatarUser">M</div></div>
      </header>
      <section id="messages" class="messages" aria-live="polite"></section>
      <div class="composerDock">
        <form id="composer" class="composer">
          <div class="tools"><button type="button">📎</button><button type="button">◎</button><button type="button">☷</button></div>
          <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا..." aria-label="اكتب رسالتك"></textarea>
          <button id="send" class="sendButton" type="submit" aria-label="إرسال">↑</button>
        </form>
        <div class="disclaimer">King Agents قد يقدم معلومات غير دقيقة. يرجى التحقق من التفاصيل المهمة.</div>
      </div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
