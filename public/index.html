<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>King Agents</title>
  <meta name="description" content="Multi-agent AI workspace powered by OpenRouter" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">K</div><div><b>King Agents</b><span>AI Workspace</span></div></div>
      <div class="label">الوكلاء</div>
      <nav id="agents" class="agents" aria-label="الوكلاء"></nav>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div><h1 id="agentTitle">وكيل تنظيم العمل</h1><p id="agentDesc"></p></div>
        <div class="status"><i></i> OpenRouter Free Router</div>
      </header>
      <section id="messages" class="messages" aria-live="polite"></section>
      <form id="composer" class="composer">
        <textarea id="input" rows="3" placeholder="اكتب المهمة هنا…" aria-label="المهمة"></textarea>
        <div class="composerFoot"><span>Enter للإرسال · Shift+Enter لسطر جديد</span><button id="send" type="submit">إرسال</button></div>
      </form>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
